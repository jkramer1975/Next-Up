<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
// Applies the saved color theme before first paint, matching the exact
// same mechanism used in next-up-movies.html — kept in sync manually
// since this is a separate file. If you ever add a new theme there,
// add it here too.
(function(){
  try{
    var THEME_VARS = {
      amber:    { bg:'#14141a', surface:'#1e1e27', surface2:'#262633', amber:'#f2a93b', amberRgb:'242,169,59', amberDim:'#a8752b', cream:'#efe7da', muted:'#8b8b98', line:'#34343f' },
      crimson:  { bg:'#14141a', surface:'#1e1e27', surface2:'#262633', amber:'#e2545f', amberRgb:'226,84,95', amberDim:'#9c3a42', cream:'#efe7da', muted:'#8b8b98', line:'#34343f' },
      emerald:  { bg:'#14141a', surface:'#1e1e27', surface2:'#262633', amber:'#4fbf8b', amberRgb:'79,191,139', amberDim:'#35805e', cream:'#efe7da', muted:'#8b8b98', line:'#34343f' },
      sapphire: { bg:'#12141a', surface:'#1c1f27', surface2:'#242833', amber:'#5b9fe3', amberRgb:'91,159,227', amberDim:'#3d6d9c', cream:'#e9edf5', muted:'#8b93a3', line:'#2e3340' },
      violet:   { bg:'#16131a', surface:'#211d27', surface2:'#2a2433', amber:'#b98af0', amberRgb:'185,138,240', amberDim:'#7d5aa6', cream:'#efe7f5', muted:'#948b9e', line:'#38313f' },
      popcorn:  { bg:'#f4ede0', surface:'#ffffff', surface2:'#f2e8d4', amber:'#d9822b', amberRgb:'217,130,43', amberDim:'#a85f18', cream:'#241a08', muted:'#7a6c54', line:'#ddd0b8' }
    };
    var saved = localStorage.getItem('fmn_color_theme');
    var name = saved ? JSON.parse(saved) : 'amber';
    var t = THEME_VARS[name] || THEME_VARS.amber;
    var s = document.documentElement.style;
    s.setProperty('--bg', t.bg);
    s.setProperty('--surface', t.surface);
    s.setProperty('--surface-2', t.surface2);
    s.setProperty('--amber', t.amber);
    s.setProperty('--amber-rgb', t.amberRgb);
    s.setProperty('--amber-dim', t.amberDim);
    s.setProperty('--cream', t.cream);
    s.setProperty('--muted', t.muted);
    s.setProperty('--line', t.line);
  } catch(e){ /* falls back to the default theme in the stylesheet below */ }
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14141a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Next Up">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Next Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<style>
  :root{
    --bg: #14141a;
    --surface: #1e1e27;
    --surface-2: #262633;
    --amber: #f2a93b;
    --amber-rgb: 242,169,59;
    --amber-dim: #a8752b;
    --cream: #efe7da;
    --muted: #8b8b98;
    --line: #34343f;
    --font-display: 'Bebas Neue', 'Arial Narrow', sans-serif;
    --font-body: 'Inter', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0; background: var(--bg); color: var(--cream);
    font-family: var(--font-body);
    min-height: 100vh;
    padding: 24px 16px;
  }
  .landing{
    max-width: 480px; width:100%; margin: 0 auto;
  }
  .account-corner{
    display: flex; justify-content: flex-end; align-items:center;
    margin-bottom: 10px;
    font-family: var(--font-mono); font-size: 11px;
  }
  .account-corner button{
    font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.5px;
    background: var(--surface-2); color: var(--cream); border: 1px solid var(--line);
    border-radius: 14px; padding: 5px 12px; cursor: pointer;
  }
  .account-corner button:hover{ border-color: var(--amber); }
  .account-corner .signed-in-pill{
    display: flex; align-items: center; gap: 7px;
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px;
    padding: 4px 6px 4px 10px;
  }
  .account-corner .signed-in-name{ color: var(--muted); max-width: 160px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .account-corner .signout-x{
    background: none; border: none; color: var(--muted); cursor: pointer; font-size: 13px;
    padding: 2px 4px; border-radius: 50%; line-height:1;
  }
  .account-corner .signout-x:hover{ color: var(--velvet, #a13446); border: none; }
  .auth-status{
    text-align:center; font-size: 11.5px; color: var(--muted); margin-top: 4px;
  }
  .version-badge{
    position: absolute; bottom: 6px; right: 10px;
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.3px;
    color: var(--muted); opacity: 0.55; pointer-events: none;
  }
  .marquee{
    position: relative;
    text-align:center;
    padding: 26px 12px 30px;
    margin-bottom: 24px;
    background: linear-gradient(180deg, var(--surface), var(--bg));
    border-radius: 6px;
    border: 1px solid var(--line);
  }
  .sprockets{
    position:absolute; top:0; left:0; right:0; height:10px;
    background-image: radial-gradient(circle, var(--line) 1.5px, transparent 1.6px);
    background-size: 16px 10px; background-position: 8px 4px;
    opacity: 0.6;
  }
  h1{
    font-family: var(--font-display); font-size: 46px; letter-spacing: 1px;
    margin: 4px 0 6px; color: var(--cream);
  }
  .tagline{
    font-family: var(--font-body); font-size: 13px; color: var(--muted);
  }
  .app-list{ display:flex; flex-direction:column; gap: 12px; }
  .app-card{
    display:flex; align-items:center; gap: 14px;
    background: var(--surface); border:1px solid var(--line); border-radius: 10px;
    padding: 16px 18px; text-decoration:none; color: inherit;
    transition: border-color 0.15s;
  }
  .app-card:hover{ border-color: var(--amber); }
  .app-card .icon{ font-size: 30px; line-height:1; flex-shrink:0; width: 34px; text-align:center; }
  .app-card .title{ font-family: var(--font-display); font-size: 20px; letter-spacing: 0.5px; }
  .app-card .desc{ font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .app-card.disabled{
    opacity: 0.5; cursor: default; pointer-events: none;
  }
  .app-card .badge{
    margin-left:auto; font-family: var(--font-mono); font-size: 10px;
    color: var(--muted); border:1px solid var(--line); border-radius: 10px;
    padding: 3px 8px; flex-shrink:0; white-space:nowrap;
  }
  .footer-note{
    text-align:center; margin-top: 20px; font-size: 11.5px; color: var(--muted);
  }
</style>
</head>
<body>
  <div class="landing">
    <div class="account-corner" id="accountCorner">
      <div id="authSignedOut">
        <button id="signInBtn">Sign in with Google</button>
      </div>
      <div id="authSignedIn" class="signed-in-pill" style="display:none;">
        <span class="signed-in-name" id="authName"></span>
        <button class="signout-x" id="signOutBtn" title="Sign out">✕</button>
      </div>
    </div>

    <div class="marquee">
      <div class="sprockets"></div>
      <h1>NEXT UP</h1>
      <div class="tagline">Pick something to spin up.</div>
      <div class="version-badge" id="versionBadge"></div>
    </div>
    <div class="auth-status" id="authStatus" style="display:none;"></div>

    <div class="app-list">
      <a class="app-card" href="next-up-movies.html">
        <div class="icon">🎬</div>
        <div>
          <div class="title">Movies</div>
          <div class="desc">Spin for a random decade + genre, then pick from the list.</div>
        </div>
      </a>

      <a class="app-card" href="next-up-tv.html">
        <div class="icon">📺</div>
        <div>
          <div class="title">TV Shows</div>
          <div class="desc">Same idea, for series instead of movies.</div>
        </div>
        <div class="badge">Beta</div>
      </a>

      <div class="app-card disabled">
        <div class="icon">📚</div>
        <div>
          <div class="title">Book Selection</div>
          <div class="desc">Same idea, for your next read.</div>
        </div>
        <div class="badge">Coming soon</div>
      </div>
    </div>

    <div class="footer-note">Next Up Suite — a free, independent project</div>
  </div>
<script>
const INDEX_VERSION = '1.0.0'; // tracked independently from next-up-movies.html's own version — this is a separate file
document.getElementById('versionBadge').textContent = 'v' + INDEX_VERSION;

/* Same Firebase project as next-up-movies.html ("Next Up Suite") — shared
   across the whole app suite. Only Auth is needed here; this page has no
   app-specific data of its own to read or write, so Firestore isn't
   loaded at all. Signing in here persists at the origin level, so it
   carries over automatically once you navigate into Movies (or any
   future section) — no extra syncing needed on this page. */
const firebaseConfig = {
  apiKey: "AIzaSyADAPuMongfa8YII9PY39DWNeWuMnFknLc",
  authDomain: "next-up-suite.firebaseapp.com",
  projectId: "next-up-suite",
  storageBucket: "next-up-suite.firebasestorage.app",
  messagingSenderId: "517680626452",
  appId: "1:517680626452:web:37b6ef5f9324d4beb36001",
  measurementId: "G-44NFR9FPGX"
};
firebase.initializeApp(firebaseConfig);
const fbAuth = firebase.auth();

function showAuthStatus(msg){
  const el = document.getElementById('authStatus');
  el.textContent = msg;
  el.style.display = msg ? 'block' : 'none';
}

fbAuth.onAuthStateChanged((user) => {
  if (user){
    document.getElementById('authSignedOut').style.display = 'none';
    document.getElementById('authSignedIn').style.display = 'flex';
    document.getElementById('authName').textContent = user.displayName || user.email || 'Signed in';
    showAuthStatus('');
  } else {
    document.getElementById('authSignedOut').style.display = 'block';
    document.getElementById('authSignedIn').style.display = 'none';
  }
});

function signInWithGoogle(){
  // Same dual-path pattern as next-up-movies.html: native Android
  // Credential Manager when running inside the app's WebView (Google
  // actively blocks OAuth popups inside an embedded WebView), otherwise
  // the normal browser popup flow.
  const hasNativeBridge = typeof Android !== 'undefined' && typeof Android.signIn === 'function';
  if (hasNativeBridge){
    showAuthStatus('Opening Google sign-in…');
    Android.signIn(); // result arrives async via window.onNativeGoogleSignIn below
    return;
  }
  if (location.protocol === 'file:'){
    showAuthStatus('Google Sign-In needs the app loaded from a real web address (https://…) — it can\'t work when opening this file directly. Try it from the hosted version instead.');
    return;
  }
  showAuthStatus('Opening sign-in…');
  const provider = new firebase.auth.GoogleAuthProvider();
  fbAuth.signInWithPopup(provider).catch(e => {
    console.warn('Google sign-in failed', e.message);
    showAuthStatus('Sign-in failed: ' + e.message);
  });
}

// Called by the native Android side (MainActivity.kt) after it gets a
// Google credential outside the WebView — same contract next-up-movies.html
// uses. Payload is a JSON string: {success:true, idToken} or {success:false, error}.
window.onNativeGoogleSignIn = function(payloadStr){
  let payload;
  try{ payload = JSON.parse(payloadStr); }
  catch(e){ showAuthStatus('Sign-in failed: unexpected response from the app.'); return; }

  if (!payload.success){
    showAuthStatus('Sign-in failed: ' + (payload.error || 'unknown error'));
    return;
  }
  const credential = firebase.auth.GoogleAuthProvider.credential(payload.idToken);
  fbAuth.signInWithCredential(credential).catch(e => {
    console.warn('Firebase sign-in with native credential failed', e.message);
    showAuthStatus('Sign-in failed: ' + e.message);
  });
};

document.getElementById('signInBtn').addEventListener('click', signInWithGoogle);
document.getElementById('signOutBtn').addEventListener('click', () => {
  const hasNativeBridge = typeof Android !== 'undefined' && typeof Android.signOutNative === 'function';
  if (hasNativeBridge) Android.signOutNative();
  fbAuth.signOut();
});
</script>
<script>
// Registers the service worker — same mechanism as next-up-movies.html,
// kept in sync manually. Since this is now the actual entry point for the
// suite, it needs its own registration call rather than relying on the
// movies page happening to register it first.
if ('serviceWorker' in navigator && location.protocol !== 'file:'){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then((registration) => {
      registration.update().catch(() => {});
    }).catch((e) => console.warn('Service worker registration failed', e));

    let hasReloadedForUpdate = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (hasReloadedForUpdate) return;
      hasReloadedForUpdate = true;
      location.reload();
    });
  });
}
</script>
</body>
</html>
